# 发版（docs/03 第三/四节）：push v* tag → 构建 Windows zip 与 Android APK → 发 GitHub Release
name: Release

on:
  push:
    tags: ['v*']

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release

      - name: 打包便携 zip
        shell: pwsh
        run: |
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' `
            -DestinationPath 'creative_kb-windows-amd64.zip'

      - uses: actions/upload-artifact@v4
        with:
          name: creative_kb-windows-amd64
          path: creative_kb-windows-amd64.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: 重命名产物
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk creative_kb-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: creative_kb-android
          path: creative_kb-android.apk

  release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: creative_kb-windows-amd64

      - uses: actions/download-artifact@v4
        with:
          name: creative_kb-android

      - name: 发布 Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            creative_kb-windows-amd64.zip
            creative_kb-android.apk
          generate_release_notes: true
